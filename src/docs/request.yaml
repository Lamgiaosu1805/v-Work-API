          description: Lọc theo trạng thái
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Lọc từ ngày tạo đơn (yyyy-mm-dd, theo giờ Asia/Ho_Chi_Minh) — không parse được trả 400
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Lọc tới ngày tạo đơn (yyyy-mm-dd, theo giờ Asia/Ho_Chi_Minh) — không parse được trả 400
        - in: query
          name: page
          schema: { type: integer, default: 1 }
          description: Không phải số nguyên >= 1 sẽ tự fallback về 1, không lỗi
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
          description: Tối đa 100 (tự động giới hạn trần), không phải số nguyên >= 1 sẽ fallback về 20
      responses:
        "200":
          description: "Danh sách đơn của tôi, kèm pagination (total, page, limit, total_pages)"
        "400":
          description: "request_type không hợp lệ, hoặc from/to không parse được thành ngày"
        "404": { description: Không tìm thấy thông tin nhân viên }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /requests/review/{id}:
    patch:
      tags: [Request]
      summary: Duyệt / từ chối đơn
      description: >-
        Đơn cần đa duyệt (leave total_days>3, forgot_checkin/late_early vượt ngưỡng occurrence) cần đủ
        2 lượt approve từ 2 reviewer khác nhau mới finalize — lượt đầu trả về đơn vẫn "pending", message
        báo đang chờ người duyệt tiếp theo. reject luôn finalize ngay (veto 1 người, kể cả khi đã có 1
        lượt approve trước đó — approval cũ không bị xoá, chỉ không còn hiệu lực). Với forgot_checkin/
        late_early đa duyệt, lượt approve đầu tiên bắt buộc phải là trưởng bộ phận (người gần nhất trong
        chuỗi phê duyệt), trừ khi reviewer có quyền review toàn bộ.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reviewer_note: { type: string }
      responses:
        "200":
          description: >-
            Đã ghi nhận duyệt. Nếu là lượt approve đầu của đơn đa duyệt, đơn vẫn ở trạng thái "pending"
            (message báo đang chờ người duyệt tiếp theo); ngược lại đơn đã finalize (approved/rejected).
        "400": { description: ID không hợp lệ / hành động không hợp lệ }
        "403":
          description: >-
            Không được chỉ định duyệt đơn này / không thể tự duyệt đơn của mình / cần trưởng bộ phận
            duyệt trước (forgot_checkin, late_early đa duyệt, lượt đầu)
        "404": { description: "Đơn không tồn tại, hoặc tài khoản chưa gắn hồ sơ nhân viên" }
        "409":
          description: >-
            Đơn không ở trạng thái chờ duyệt / bạn đã duyệt đơn này rồi / đơn đang được xử lý duyệt bởi
            thao tác khác, vui lòng thử lại (Redis lock, chỉ áp dụng đơn đa duyệt)
        "401": { $ref: "#/components/responses/Unauthorized" }

  /requests/cancel/{id}:
    patch:
      tags: [Request]
      summary: Hủy đơn (người tạo)
      description: >-
        Chỉ chủ đơn được hủy, và chỉ khi đơn còn ở trạng thái pending. Nếu loại đơn có side-effect
        khi bị từ chối (vd hoàn lại số ngày phép cho đơn nghỉ), side-effect đó cũng chạy khi hủy.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Hủy đơn thành công }
        "400": { $ref: "#/components/responses/InvalidId" }
        "403": { description: Không phải chủ đơn này }
        "404":
          description: "Đơn không tồn tại, hoặc tài khoản chưa gắn hồ sơ nhân viên"
        "409":
          description: "Đơn không còn ở trạng thái pending, hoặc đang được xử lý bởi thao tác khác (race condition — thử lại)"
        "401": { $ref: "#/components/responses/Unauthorized" }
